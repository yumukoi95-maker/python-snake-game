
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUika VS T.Koi - Snake Game</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
}
#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.top {
  position: fixed;
  top: 12px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  pointer-events: none;
  z-index: 2;
}
.panel {
  background: #101f34eF;
  border: 1px solid #38516d;
  border-radius: 12px;
  padding: 9px 16px;
  font-weight: bold;
  box-shadow: 0 4px 18px #0007;
}
.green { color: #5dff91; }
.blue { color: #69baff; }
#status { color: #ffd66b; }
.controls {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 9px;
  align-items: center;
  z-index: 3;
}
button {
  border: 1px solid #52708f;
  background: #18304c;
  color: white;
  padding: 12px 19px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .5; cursor: wait; }
button:hover { background: #294968; }
.mobile {
  position: fixed;
  right: 18px;
  bottom: 90px;
  display: grid;
  grid-template-columns: 48px 48px 48px;
  grid-template-rows: 48px 48px;
  gap: 5px;
  z-index: 3;
}
.mobile button {
  padding: 0;
  font-size: 22px;
  touch-action: none;
}
.up { grid-column: 2; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }
#loading {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #07111f;
  z-index: 10;
  font-size: 22px;
  font-weight: bold;
}
@media (max-width: 650px) {
  .top { gap: 5px; top: 7px; }
  .panel { padding: 7px 9px; font-size: 12px; }
  .controls { bottom: 10px; gap: 5px; }
  button { padding: 10px 12px; font-size: 12px; }
  .mobile { right: 10px; bottom: 78px; }
}
</style>
</head>
<body>

<div id="loading">🐍 Loading Yuika vs T.Koi...</div>

<div id="game">
  <canvas id="canvas"></canvas>
</div>

<div class="top">
  <div class="panel green">YUika: <span id="yuikaScore">0</span></div>
  <div class="panel blue">T.Koi: <span id="tkoiScore">0</span></div>
  <div class="panel" id="status">READY</div>
</div>

<div class="controls">
  <button id="startBtn" disabled>Loading...</button>
  <button id="pauseBtn" disabled>Pause</button>
  <button id="restartBtn" disabled>Restart</button>
</div>

<div class="mobile">
  <button class="up" data-dir="up">▲</button>
  <button class="left" data-dir="left">◀</button>
  <button class="down" data-dir="down">▼</button>
  <button class="right" data-dir="right">▶</button>
</div>

<script>
const W = 40;
const H = 26;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let pyodide;
let running = false;
let gameOver = false;
let timer = null;
let playerDirection = {x: 1, y: 0};
let lastDirection = {x: 1, y: 0};
let state = null;

const directions = {
  up: {x: 0, y: -1},
  down: {x: 0, y: 1},
  left: {x: -1, y: 0},
  right: {x: 1, y: 0}
};

const pythonCode = `
import random
import json

W = 40
H = 26

players = []
apple = None
game_over = False
winner = ""
message = ""

def random_apple():
    occupied = set()
    for p in players:
        occupied.update(p["body"])

    free = [
        (x, y)
        for x in range(W)
        for y in range(H)
        if (x, y) not in occupied
    ]

    if not free:
        return None

    return random.choice(free)

def reset_game():
    global players, apple, game_over, winner, message

    players = [
        {
            "name": "Yuika",
            "body": [(8, 13), (7, 13), (6, 13)],
            "direction": (1, 0),
            "score": 0
        },
        {
            "name": "T.Koi",
            "body": [(31, 13), (32, 13), (33, 13)],
            "direction": (-1, 0),
            "score": 0
        }
    ]

    apple = random_apple()
    game_over = False
    winner = ""
    message = "Eat apples and have fun!"

def safe_direction(p, direction):
    dx, dy = direction
    hx, hy = p["body"][0]
    nx, ny = hx + dx, hy + dy

    if nx < 0 or nx >= W or ny < 0 or ny >= H:
        return False

    body = p["body"][:-1]
    if (nx, ny) in body:
        return False

    return True

def tkoi_ai():
    p = players[1]

    if apple is None:
        return p["direction"]

    hx, hy = p["body"][0]
    ax, ay = apple

    current = p["direction"]

    options = [
        (1, 0),
        (-1, 0),
        (0, 1),
        (0, -1)
    ]

    # Never reverse directly into its own body.
    options = [
        d for d in options
        if not (d[0] == -current[0] and d[1] == -current[1])
    ]

    safe = [d for d in options if safe_direction(p, d)]

    if not safe:
        return current

    safe.sort(
        key=lambda d:
        abs(hx + d[0] - ax) + abs(hy + d[1] - ay)
        + random.random() * 0.3
    )

    return safe[0]

def get_state():
    return json.dumps({
        "players": [
            {
                "name": p["name"],
                "body": p["body"],
                "score": p["score"]
            }
            for p in players
        ],
        "apple": apple,
        "game_over": game_over,
        "winner": winner,
        "message": message
    })

def step(dx, dy):
    global players, apple, game_over, winner, message

    if game_over:
        return get_state()

    # Update Yuika's direction.
    current = players[0]["direction"]

    if not (dx == -current[0] and dy == -current[1]):
        players[0]["direction"] = (dx, dy)

    # T.Koi chooses its own direction.
    players[1]["direction"] = tkoi_ai()

    new_bodies = []
    died = [False, False]
    ate = [False, False]

    # Move both snakes independently.
    # Touching the other snake is completely safe.
    for i, p in enumerate(players):
        hx, hy = p["body"][0]
        vx, vy = p["direction"]

        new_head = (hx + vx, hy + vy)

        if new_head[0] < 0 or new_head[0] >= W:
            died[i] = True

        if new_head[1] < 0 or new_head[1] >= H:
            died[i] = True

        ate[i] = (apple is not None and new_head == apple)

        new_body = [new_head] + list(p["body"])

        if not ate[i]:
            new_body.pop()

        # Only check collision with its OWN body.
        if new_head in new_body[1:]:
            died[i] = True

        new_bodies.append(new_body)

    # Apply the movements.
    for i, p in enumerate(players):
        p["body"] = new_bodies[i]

    if died[0] or died[1]:
        game_over = True

        if died[0] and died[1]:
            winner = "DRAW"
            message = "Both snakes hit themselves or a wall!"
        elif died[0]:
            winner = "T.Koi"
            message = "Yuika hit a wall or its own body!"
        else:
            winner = "Yuika"
            message = "T.Koi hit a wall or its own body!"

        return get_state()

    # Award apple points.
    for i, p in enumerate(players):
        if ate[i]:
            p["score"] += 1

    if any(ate):
        apple = random_apple()

        if apple is None:
            game_over = True
            winner = "DRAW"
            message = "Amazing! The board is full!"

    return get_state()

reset_game()
`;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  ctx.clearRect(0, 0, width, height);

  const cell = Math.min(width / W, height / H);
  const boardW = cell * W;
  const boardH = cell * H;
  const ox = (width - boardW) / 2;
  const oy = (height - boardH) / 2;

  ctx.fillStyle = "#0b1a2b";
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#10263a";
  ctx.fillRect(ox, oy, boardW, boardH);

  // Grid
  ctx.strokeStyle = "#1d3850";
  ctx.lineWidth = 0.6;

  for (let x = 0; x <= W; x++) {
    ctx.beginPath();
    ctx.moveTo(ox + x * cell, oy);
    ctx.lineTo(ox + x * cell, oy + boardH);
    ctx.stroke();
  }

  for (let y = 0; y <= H; y++) {
    ctx.beginPath();
    ctx.moveTo(ox, oy + y * cell);
    ctx.lineTo(ox + boardW, oy + y * cell);
    ctx.stroke();
  }

  if (!state) return;

  // Apple
  if (state.apple) {
    const [ax, ay] = state.apple;
    const cx = ox + (ax + 0.5) * cell;
    const cy = oy + (ay + 0.5) * cell;

    ctx.fillStyle = "#ff4058";
    ctx.beginPath();
    ctx.arc(cx, cy, cell * 0.34, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#7cff76";
    ctx.fillRect(cx + cell * 0.06, cy - cell * 0.42,
                 cell * 0.12, cell * 0.23);
  }

  // Snakes
  state.players.forEach((p, index) => {
    const color = index === 0 ? "#42ed83" : "#46a9ff";
    const dark = index === 0 ? "#168f50" : "#1769b6";

    p.body.forEach(([x, y], part) => {
      const px = ox + x * cell;
      const py = oy + y * cell;
      const inset = cell * 0.07;

      ctx.fillStyle = part === 0 ? color : dark;
      ctx.beginPath();
      ctx.roundRect(
        px + inset,
        py + inset,
        cell - inset * 2,
        cell - inset * 2,
        cell * 0.22
      );
      ctx.fill();

      if (part === 0) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(px + cell * 0.35, py + cell * 0.35,
                cell * 0.08, 0, Math.PI * 2);
        ctx.arc(px + cell * 0.65, py + cell * 0.35,
                cell * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  });

  // Arena border
  ctx.strokeStyle = "#6d8ba8";
  ctx.lineWidth = 3;
  ctx.strokeRect(ox, oy, boardW, boardH);
}

function updateUI() {
  if (!state) return;

  document.getElementById("yuikaScore").textContent =
    state.players[0].score;

  document.getElementById("tkoiScore").textContent =
    state.players[1].score;

  const status = document.getElementById("status");

  if (state.game_over) {
    status.textContent = state.winner === "DRAW"
      ? "DRAW!"
      : state.winner + " WINS!";
  } else {
    status.textContent = running ? "PLAYING" : "PAUSED";
  }
}

function setDirection(name) {
  const d = directions[name];
  if (!d || gameOver) return;

  if (d.x === -lastDirection.x && d.y === -lastDirection.y) {
    return;
  }

  playerDirection = d;
}

function tick() {
  if (!running || gameOver || !pyodide) return;

  try {
    const result = pyodide.runPython(
      `step(${playerDirection.x}, ${playerDirection.y})`
    );

    state = JSON.parse(result);

    lastDirection = {...playerDirection};

    if (state.game_over) {
      gameOver = true;
      running = false;
      clearInterval(timer);
      document.getElementById("status").textContent =
        state.winner === "DRAW"
          ? "DRAW!"
          : state.winner + " WINS!";
      document.getElementById("startBtn").textContent = "Play Again";
    }

    updateUI();
    draw();
  } catch (error) {
    console.error(error);
    document.getElementById("status").textContent = "GAME ERROR";
  }
}

function startGame() {
  if (!pyodide) return;

  if (gameOver) {
    restartGame();
    return;
  }

  running = true;
  document.getElementById("startBtn").textContent = "Playing";
  document.getElementById("status").textContent = "PLAYING";

  clearInterval(timer);
  timer = setInterval(tick, 125);
}

function pauseGame() {
  if (!running) {
    startGame();
    return;
  }

  running = false;
  clearInterval(timer);

  document.getElementById("startBtn").textContent = "Resume";
  document.getElementById("status").textContent = "PAUSED";
}

function restartGame() {
  if (!pyodide) return;

  running = false;
  gameOver = false;
  clearInterval(timer);

  pyodide.runPython("reset_game()");
  state = JSON.parse(pyodide.runPython("get_state()"));

  playerDirection = {x: 1, y: 0};
  lastDirection = {x: 1, y: 0};

  document.getElementById("startBtn").textContent = "Start Game";
  document.getElementById("status").textContent = "READY";

  updateUI();
  draw();
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("pauseBtn").onclick = pauseGame;
document.getElementById("restartBtn").onclick = restartGame;

window.addEventListener("keydown", (event) => {
  const keys = {
    ArrowUp: "up",
    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right",
    w: "up",
    s: "down",
    a: "left",
    d: "right"
  };

  if (keys[event.key]) {
    event.preventDefault();
    setDirection(keys[event.key]);
  }

  if (event.code === "Space") {
    event.preventDefault();
    pauseGame();
  }
});

document.querySelectorAll(".mobile button").forEach(button => {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    setDirection(button.dataset.dir);
  });
});

window.addEventListener("resize", resize);

async function initialize() {
  resize();

  try {
    pyodide = await loadPyodide();
    await pyodide.runPythonAsync(pythonCode);

    state = JSON.parse(pyodide.runPython("get_state()"));

    document.getElementById("loading").style.display = "none";
    document.getElementById("startBtn").disabled = false;
    document.getElementById("pauseBtn").disabled = false;
    document.getElementById("restartBtn").disabled = false;

    document.getElementById("startBtn").textContent = "Start Game";

    updateUI();
    draw();
  } catch (error) {
    document.getElementById("loading").textContent =
      "Could not load game. Please refresh the page.";
    console.error(error);
  }
}

initialize();
</script>
</body>
</html>
