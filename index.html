
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YUika VS T.Koi - Snake Duel</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111e;color:white;font-family:Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#title{position:fixed;z-index:3;top:12px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:bold;color:#4ade80;text-shadow:0 0 15px #16a34a}
#status{position:fixed;z-index:3;top:52px;left:50%;transform:translateX(-50%);background:#102137dd;padding:8px 14px;border-radius:8px;color:#facc15;font-size:13px;white-space:nowrap}
#scores{position:fixed;z-index:3;top:95px;left:12px;background:#102137e8;padding:12px;border:1px solid #334155;border-radius:10px}
.score{margin:8px 0;font-weight:bold}
#buttons{position:fixed;z-index:4;top:95px;right:12px;display:flex;gap:8px}
button{border:0;border-radius:8px;padding:12px 16px;background:#22c55e;color:#07111e;font-weight:bold;cursor:pointer}
#pause{background:#334155;color:white}
.controls{position:fixed;z-index:4;right:15px;bottom:15px;text-align:center}
.controls button{min-width:48px;margin:3px;font-size:18px}
#help{position:fixed;z-index:3;bottom:15px;left:15px;color:#cbd5e1;font-size:12px}
@media(max-width:600px){
 #title{font-size:22px}
 #scores{top:95px;font-size:13px}
 #help{max-width:150px;line-height:1.5}
 .controls button{min-width:40px;padding:9px}
}
</style>
</head>
<body>

<div id="title">🐍 YUIKA VS T.KOI</div>
<div id="status">Loading Python engine...</div>

<canvas id="game"></canvas>

<div id="scores">
 <div class="score" style="color:#4ade80">🟢 YUIKA: <span id="yuikaScore">0</span></div>
 <div class="score" style="color:#60a5fa">🔵 T.KOI: <span id="tkoiScore">0</span></div>
</div>

<div id="buttons">
 <button id="start" disabled>START</button>
 <button id="pause" disabled>PAUSE</button>
</div>

<div class="controls">
 <div><button data-dir="UP">⬆️</button></div>
 <div>
  <button data-dir="LEFT">⬅️</button>
  <button data-dir="DOWN">⬇️</button>
  <button data-dir="RIGHT">➡️</button>
 </div>
</div>

<div id="help">Arrow keys / WASD to move Yuika. Avoid T.Koi, yourself and the walls!</div>

<script>
const W=40,H=26,CELL=24;
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");
const startBtn=document.getElementById("start");
const pauseBtn=document.getElementById("pause");

let pyodide=null;
let timer=null;
let paused=false;
let gameOver=false;

const pythonCode=`
import random,json

W=40
H=26

players=[]
food=None
game_over=False
winner=""
message=""

def make_snake(name,body,direction):
    return {
        "name":name,
        "body":body,
        "direction":direction,
        "next":direction,
        "score":0
    }

def reset_game():
    global players,food,game_over,winner,message

    players=[
        make_snake("Yuika",[(8,12),(7,12),(6,12)],(1,0)),
        make_snake("T.Koi",[(31,12),(32,12),(33,12)],(-1,0))
    ]

    game_over=False
    winner=""
    message=""
    spawn_food()
    return get_state()

def occupied_cells():
    result=set()
    for p in players:
        result.update(p["body"])
    return result

def spawn_food():
    global food
    occupied=occupied_cells()
    empty=[
        (x,y)
        for x in range(W)
        for y in range(H)
        if (x,y) not in occupied
    ]
    food=random.choice(empty) if empty else None

def change_direction(name):
    directions={
        "UP":(0,-1),
        "DOWN":(0,1),
        "LEFT":(-1,0),
        "RIGHT":(1,0)
    }
    d=directions.get(name)
    if d:
        current=players[0]["direction"]
        if d!=(-current[0],-current[1]):
            players[0]["next"]=d

def tkoi_ai():
    p=players[1]
    head=p["body"][0]

    options=[(1,0),(-1,0),(0,1),(0,-1)]
    options=[
        d for d in options
        if d!=(-p["direction"][0],-p["direction"][1])
    ]

    occupied=occupied_cells()
    safe=[]

    for d in options:
        x=head[0]+d[0]
        y=head[1]+d[1]

        if not (0<=x<W and 0<=y<H):
            continue

        if (x,y) in occupied and (x,y)!=p["body"][-1]:
            continue

        safe.append(d)

    if not safe:
        return p["direction"]

    if food:
        safe.sort(
            key=lambda d:
            abs(head[0]+d[0]-food[0])
            +abs(head[1]+d[1]-food[1])
        )

    return safe[0]

def step():
    global game_over,winner,message,food

    if game_over:
        return get_state()

    directions=[
        players[0]["next"],
        tkoi_ai()
    ]

    new_heads=[]

    for i,p in enumerate(players):
        d=directions[i]
        p["direction"]=d
        head=p["body"][0]
        new_heads.append((head[0]+d[0],head[1]+d[1]))

    # Wall collision
    for i,(x,y) in enumerate(new_heads):
        if x<0 or x>=W or y<0 or y>=H:
            game_over=True
            winner=players[1-i]["name"]
            message=players[i]["name"]+" hit the wall!"
            return get_state()

    growing=[
        new_heads[i]==food for i in range(2)
    ]

    # Remove tails before checking body collisions
    for i,p in enumerate(players):
        if not growing[i]:
            p["body"].pop()

    dead=[False,False]

    for i,(x,y) in enumerate(new_heads):
        if (x,y) in players[i]["body"]:
            dead[i]=True

        other=players[1-i]
        if (x,y) in other["body"]:
            dead[i]=True

    # Head-to-head collision
    if new_heads[0]==new_heads[1]:
        dead=[True,True]

    if dead[0] or dead[1]:
        game_over=True

        if dead[0] and dead[1]:
            winner="DRAW"
            message="Both snakes collided!"
        elif dead[0]:
            winner="T.Koi"
            message="Yuika lost the duel!"
        else:
            winner="Yuika"
            message="T.Koi lost the duel!"

        return get_state()

    for i,p in enumerate(players):
        p["body"].insert(0,new_heads[i])

        if growing[i]:
            p["score"]+=1

    if any(growing):
        spawn_food()

    return get_state()

def get_state():
    return json.dumps({
        "players":players,
        "food":food,
        "game_over":game_over,
        "winner":winner,
        "message":message
    })

reset_game()
`;

function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=innerWidth*dpr;
 canvas.height=innerHeight*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function draw(s){
 const vw=innerWidth;
 const vh=innerHeight;

 const scale=Math.min(vw/(W*CELL),vh/(H*CELL));
 const ox=(vw-W*CELL*scale)/2;
 const oy=(vh-H*CELL*scale)/2;

 ctx.fillStyle="#07111e";
 ctx.fillRect(0,0,vw,vh);

 ctx.save();
 ctx.translate(ox,oy);
 ctx.scale(scale,scale);

 ctx.fillStyle="#0b1928";
 ctx.fillRect(0,0,W*CELL,H*CELL);

 ctx.strokeStyle="#1d354b";
 ctx.lineWidth=1;

 for(let x=0;x<=W;x++){
  ctx.beginPath();
  ctx.moveTo(x*CELL,0);
  ctx.lineTo(x*CELL,H*CELL);
  ctx.stroke();
 }

 for(let y=0;y<=H;y++){
  ctx.beginPath();
  ctx.moveTo(0,y*CELL);
  ctx.lineTo(W*CELL,y*CELL);
  ctx.stroke();
 }

 ctx.strokeStyle="#4ade80";
 ctx.lineWidth=4;
 ctx.strokeRect(0,0,W*CELL,H*CELL);

 // Apple
 if(s.food){
  const [x,y]=s.food;
  ctx.fillStyle="#ef4444";
  ctx.beginPath();
  ctx.arc(x*CELL+12,y*CELL+12,9,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#4ade80";
  ctx.fillRect(x*CELL+11,y*CELL+2,3,7);
 }

 // Draw Yuika and T.Koi
 for(const p of s.players){
  const color=p.name==="Yuika"?"#4ade80":"#60a5fa";

  p.body.forEach(([x,y],i)=>{
   ctx.fillStyle=color;
   ctx.globalAlpha=i===0?1:0.85;
   ctx.beginPath();
   ctx.roundRect(x*CELL+1,y*CELL+1,22,22,6);
   ctx.fill();
  });

  ctx.globalAlpha=1;

  const [hx,hy]=p.body[0];

  ctx.fillStyle="#07111e";
  ctx.beginPath();
  ctx.arc(hx*CELL+8,hy*CELL+8,2.5,0,Math.PI*2);
  ctx.arc(hx*CELL+16,hy*CELL+8,2.5,0,Math.PI*2);
  ctx.fill();

  ctx.font="bold 12px Arial";
  ctx.textAlign="center";
  ctx.fillStyle=color;
  ctx.fillText(p.name,hx*CELL+12,hy*CELL-5);
 }

 ctx.restore();

 document.getElementById("yuikaScore").textContent=s.players[0].score;
 document.getElementById("tkoiScore").textContent=s.players[1].score;

 if(s.game_over){
  statusEl.textContent=s.message+" WINNER: "+s.winner;
 }else if(!paused){
  statusEl.textContent="YUika VS T.Koi — EAT APPLES!";
 }
}

function tick(){
 if(!pyodide||gameOver)return;

 const s=JSON.parse(pyodide.runPython("step()"));
 draw(s);

 if(s.game_over){
  gameOver=true;
  clearInterval(timer);
  timer=null;
  statusEl.textContent=s.message+" WINNER: "+s.winner;
 }
}

function startGame(){
 if(!pyodide)return;

 clearInterval(timer);
 gameOver=false;
 paused=false;

 pyodide.runPython("reset_game()");
 draw(JSON.parse(pyodide.runPython("get_state()")));

 timer=setInterval(tick,150);
 pauseBtn.textContent="PAUSE";
 statusEl.textContent="YUika VS T.Koi! GOOD LUCK!";
}

function changeDirection(dir){
 if(!pyodide||gameOver)return;
 pyodide.globals.set("requested_dir",dir);
 pyodide.runPython("change_direction(requested_dir)");
}

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:"UP",ArrowDown:"DOWN",
  ArrowLeft:"LEFT",ArrowRight:"RIGHT",
  w:"UP",W:"UP",s:"DOWN",S:"DOWN",
  a:"LEFT",A:"LEFT",d:"RIGHT",D:"RIGHT"
 };

 if(keys[e.key]){
  e.preventDefault();
  changeDirection(keys[e.key]);
 }
});

document.querySelectorAll("[data-dir]").forEach(btn=>{
 btn.addEventListener("click",()=>changeDirection(btn.dataset.dir));
});

startBtn.addEventListener("click",startGame);

pauseBtn.addEventListener("click",()=>{
 if(!pyodide||gameOver)return;

 if(paused){
  paused=false;
  timer=setInterval(tick,150);
  pauseBtn.textContent="PAUSE";
  statusEl.textContent="GAME RESUMED!";
 }else{
  paused=true;
  clearInterval(timer);
  timer=null;
  pauseBtn.textContent="RESUME";
  statusEl.textContent="GAME PAUSED!";
 }
});

async function initialize(){
 try{
  statusEl.textContent="Loading Python...";
  pyodide=await loadPyodide();
  pyodide.runPython(pythonCode);
  draw(JSON.parse(pyodide.runPython("get_state()")));
  startBtn.disabled=false;
  pauseBtn.disabled=false;
  statusEl.textContent="YUika VS T.Koi! PRESS START!";
 }catch(e){
  statusEl.textContent="Loading error: "+e.message;
  console.error(e);
 }
}

initialize();
</script>
</body>
</html>
